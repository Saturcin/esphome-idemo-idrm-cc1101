                          );

                          float c = -1.0f;
                          float p = -1.0f;
                          if (sscanf(token.c_str(), " %f : %f ", &c, &p) != 2)
                            return -1;

                          if (c < 0.0f || c > 100.0f || p < 0.0f || p > 100.0f)
                            return -1;

                          if (c <= 0.0001f && p <= 0.0001f) {
                            // 0:0 es implícito.
                          } else {
                            c /= 100.0f;
                            p /= 100.0f;

                            if (c <= x[n - 1] + 0.000001f)
                              return -1;
                            if (p < y[n - 1] - 0.000001f)
