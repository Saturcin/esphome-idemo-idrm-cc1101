# ============================================================
# COVERS FÍSICOS
# ============================================================

cover:

  - platform: template
    name: "${persiana_1_nombre}"
    id: persiana_1
    device_class: shutter
    has_position: true
    assumed_state: true
    optimistic: false

    lambda: |-
      return id(p1_fisica);

    open_action:
      - script.execute: p1_stop_actualiza
      - script.wait: p1_stop_actualiza
      - script.execute:
          id: p1_mover
          objetivo: 1.0

    close_action:
      - script.execute: p1_stop_actualiza
      - script.wait: p1_stop_actualiza
      - script.execute:
          id: p1_mover
          objetivo: 0.0

    stop_action:
      - script.execute: p1_stop_actualiza

    position_action:
      - script.execute: p1_stop_actualiza
      - script.wait: p1_stop_actualiza
      - script.execute:
          id: p1_mover
          objetivo: !lambda |-
            return pos;

